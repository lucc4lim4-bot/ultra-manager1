<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ultra Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#071318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: console-style career hub — petrol-teal stadium night, glass panels, condensed sport type, one violet CTA glow */
:root {
  --bg0: #050f13; --bg1: #0a1f27; --bg2: #103039; --bg3: #17404a;
  --panel: rgba(8, 22, 28, 0.74); --panel-solid: #0c232b; --panel2: rgba(255, 255, 255, 0.045); --panel3: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.09); --line2: rgba(255, 255, 255, 0.16);
  --text: #eef6f7; --muted: #9bb2b8; --dim: #6f8890;
  --accent: #6f7dff; --accent-hi: #9aa4ff; --accent-glow: rgba(111, 125, 255, 0.55);
  --gold: #ffc54d; --win: #38c77f; --draw: #b9c2c9; --loss: #ff6060; --warn: #ffb020; --info: #4cc3ff;
  --pitch1: #2e7d43; --pitch2: #2a733d;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 10px; --r-lg: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg0); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg0); }
.app {
  min-height: 100%; position: relative;
  background:
    radial-gradient(1200px 520px at 78% -8%, rgba(76, 195, 255, 0.10), transparent 60%),
    radial-gradient(900px 600px at 10% 10%, rgba(111, 125, 255, 0.10), transparent 62%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 38%, var(--bg0) 100%);
}
.app::after { /* perspective floor grid like a studio set */
  content: ""; position: fixed; left: -20%; right: -20%; bottom: -10%; height: 46%; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 64px 64px; transform: perspective(500px) rotateX(62deg); transform-origin: bottom; opacity: 0.55;
  mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}
.app > * { position: relative; z-index: 1; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-hi); }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }
.tnum, table, .num { font-variant-numeric: tabular-nums; }
h1, h2, h3, .disp { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.up { text-transform: uppercase; letter-spacing: 0.06em; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; } .right { margin-left: auto; } .center { text-align: center; }
.hide { display: none !important; }

/* ---------- boot */
.boot { min-height: 100vh; display: grid; place-content: center; text-align: center; }
.boot-logo { font-family: var(--f-display); font-weight: 800; font-style: italic; font-size: 54px; letter-spacing: 0.02em; }
.boot-logo span { color: var(--accent-hi); margin-left: 8px; }
.boot-sub { color: var(--muted); margin-top: 6px; }

/* ---------- top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  background: linear-gradient(180deg, rgba(7, 20, 26, 0.92), rgba(7, 20, 26, 0.7)); border-bottom: 1px solid var(--line);
}
.topbar-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }
.logo-mark { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--text);
  font-family: var(--f-display); font-weight: 800; font-style: italic; font-size: 17px; letter-spacing: -0.02em; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; padding: 10px 12px 9px; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: 0.02em; white-space: nowrap; border-bottom: 2px solid transparent; position: relative; }
.nav button:hover { color: var(--text); }
.nav button.on { color: var(--text); border-bottom-color: var(--text); }
.nav .badge { position: absolute; top: 4px; right: 2px; }
.club-chip { display: flex; align-items: center; gap: 10px; flex: none; }
.club-chip .nm { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1; }
.conf-bar { display: flex; gap: 3px; margin-top: 5px; }
.conf-bar i { display: block; width: 18px; height: 4px; border-radius: 2px; background: var(--panel3); }
.conf-bar i.on { background: var(--win); }
.conf-bar.mid i.on { background: var(--warn); } .conf-bar.low i.on { background: var(--loss); }
.coin-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 999px; background: rgba(255, 197, 77, 0.12); border: 1px solid rgba(255, 197, 77, 0.35); color: var(--gold); font-weight: 700; font-family: var(--f-display); font-size: 16px; white-space: nowrap; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 45%, #b9801a); display: grid; place-items: center; color: #6a4300; font-size: 11px; font-weight: 800; }
.icon-btn { background: var(--panel2); border: 1px solid var(--line); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--panel3); }

.page { max-width: 1440px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.subtabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; color: var(--muted); font-weight: 600; font-size: 14px; }
.subtabs button.on { background: var(--text); color: #07161b; border-color: var(--text); }

/* ---------- panels & cards */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; min-width: 0; }
.panel h3 { font-size: 20px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.panel h3 .sub { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 980px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } }
.stat-tile { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat-tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-tile .v { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.1; margin-top: 4px; }

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 15px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--panel3); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #8592ff, #5a68f0); border-color: rgba(255,255,255,0.25); box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 28px -6px var(--accent-glow); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: linear-gradient(180deg, #ffd57a, #f0a92a); color: #3b2500; border-color: rgba(255,255,255,0.3); }
.btn.danger { border-color: rgba(255, 96, 96, 0.5); color: #ffb3b3; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.xs { padding: 3px 9px; font-size: 12px; }
.btn.big { padding: 13px 26px; font-size: 17px; font-family: var(--f-display); letter-spacing: 0.03em; }
.btn .x-key { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 12px; }
.link { background: none; border: 0; color: var(--accent-hi); padding: 0; font-weight: 600; }

/* ---------- chips / badges */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip.on { background: var(--text); color: #07161b; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--loss); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.pos { display: inline-grid; place-items: center; min-width: 38px; padding: 2px 5px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; font-family: var(--f-body); }
.pos.GK { background: #f0a92a; color: #2a1800; } .pos.DEF { background: #3f8cff; color: #fff; } .pos.MID { background: #2fbf71; color: #052414; } .pos.ATT { background: #ff5d6c; color: #fff; }
.ovr { display: inline-grid; place-items: center; min-width: 30px; height: 24px; border-radius: 6px; font-weight: 800; font-size: 14px; font-family: var(--f-display); }
.ftag { display: inline-block; margin-left: 3px; font-size: 11px; font-weight: 800; letter-spacing: -1px; vertical-align: middle; white-space: nowrap; }
.ftag.f-up { color: #2fd27a; } .ftag.f-up1 { color: #8fd8a8; } .ftag.f-dn1 { color: #ffab7a; } .ftag.f-dn { color: #ff5c5c; }
td.nw { white-space: nowrap; }
.ovr.t1 { background: linear-gradient(180deg, #ffe27a, #d9a520); color: #2b1d00; } .ovr.t2 { background: #c9d3da; color: #14232a; } .ovr.t3 { background: #c98a52; color: #241200; } .ovr.t4 { background: #4b5b62; color: #e7eef0; }
.res { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-size: 12px; font-weight: 800; color: #071318; }
.res.V { background: var(--win); } .res.E { background: var(--draw); } .res.D { background: var(--loss); color: #fff; } .res.n { background: var(--panel3); color: var(--muted); }
.fit { width: 54px; height: 6px; border-radius: 3px; background: var(--panel3); overflow: hidden; display: inline-block; vertical-align: middle; }
.fit > i { display: block; height: 100%; border-radius: 3px; }
.flag-inj { color: var(--loss); font-weight: 800; } .flag-sus { color: var(--warn); font-weight: 800; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ---------- tables */
.tbl-wrap { overflow-x: auto; border-radius: var(--r); border: 1px solid var(--line); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 9px 8px; background: rgba(0,0,0,0.18); position: sticky; top: 0; white-space: nowrap; }
.tbl td { padding: 8px; border-top: 1px solid var(--line); white-space: nowrap; }
.tbl tr.me td { background: rgba(111, 125, 255, 0.13); }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--panel2); }
.tbl td.n, .tbl th.n { text-align: right; } .tbl td.c, .tbl th.c { text-align: center; }
.zone-ucl { box-shadow: inset 3px 0 0 #4c7dff; } .zone-uel { box-shadow: inset 3px 0 0 #ff9a3c; } .zone-up { box-shadow: inset 3px 0 0 var(--win); } .zone-down { box-shadow: inset 3px 0 0 var(--loss); } .zone-lib { box-shadow: inset 3px 0 0 var(--gold); } .zone-sula { box-shadow: inset 3px 0 0 #1e88e5; } .zone-uclq { box-shadow: inset 3px 0 0 #9db8ff; } .zone-uecl { box-shadow: inset 3px 0 0 #2fbf71; }
.mun-reps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.team-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.team-cell .tn { overflow: hidden; text-overflow: ellipsis; }

/* ---------- forms */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.input, select.input { background: rgba(0,0,0,0.28); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%; }
.input:focus { border-color: var(--accent-hi); outline: none; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.seg { display: inline-flex; background: rgba(0,0,0,0.28); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--text); color: #07161b; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { display: none; }
.toggle .sw { width: 42px; height: 24px; border-radius: 12px; background: var(--panel3); position: relative; transition: background 0.2s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.toggle input:checked + .sw { background: var(--accent); }
.toggle input:checked + .sw::after { transform: translateX(18px); }

/* ---------- central (home) */
.hub { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 960px) { .hub { grid-template-columns: minmax(0, 1fr); } }
.hero-date { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 5.4vw, 62px); line-height: 0.95; letter-spacing: 0.01em; }
.hero-sub { color: var(--muted); margin: 10px 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); max-width: 560px; }
.fixture { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 14px; align-items: center; margin: 12px 0 18px; }
.fixture .sep { width: 1px; height: 56px; background: var(--line2); }
.fixture .names { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
.fixture .crests { display: flex; gap: 10px; align-items: center; }
.comp-line { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; flex-wrap: wrap; }
.comp-line .when { color: var(--muted); font-weight: 500; }
.advance-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.task-list { border-top: 1px solid var(--line); max-width: 560px; }
.task { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--text); }
.task:hover { background: var(--panel2); }
.task .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--panel3); flex: none; font-size: 16px; }
.form-row { display: flex; gap: 4px; }
.news-card { background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; position: relative; }
.news-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.news-src { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: #1fb57a; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 13px; }
.ue-logo { flex: none; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(135deg, #6f7dff, #12b3a8); color: #fff; font-family: var(--f-display); font-weight: 800; font-style: italic; letter-spacing: -0.02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
.modal-h .ue-logo { margin-right: 8px; vertical-align: -6px; display: inline-grid; }
.plantao { background: #ff3b4e; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 12px; letter-spacing: 0.08em; padding: 4px 9px; border-radius: 6px; animation: plantao 1.6s ease-in-out infinite; flex: none; }
.plantao.sm { font-size: 10.5px; padding: 2px 7px; }
@keyframes plantao { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { .plantao { animation: none; } }
.news-cat { display: inline-block; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent); padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
.news-feed { display: flex; flex-direction: column; gap: 12px; }
.nf-item { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; padding: 10px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); }
.nf-thumb { border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 10; }
.nf-thumb svg { width: 100%; height: 100%; display: block; }
.nf-text h4 { margin: 6px 0 4px; font-size: 17px; line-height: 1.25; }
.nf-text p { margin: 0 0 6px; font-size: 14px; }
@media (max-width: 560px) { .nf-item { grid-template-columns: minmax(0, 1fr); } }
.news-new { flex: none; background: #d8ff5a; color: #172000; font-weight: 800; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
.news-img { aspect-ratio: 16 / 10; max-width: 100%; position: relative; overflow: hidden; }
.news-img svg { width: 100%; height: 100%; display: block; }
.news-body { padding: 12px 14px 14px; }
.news-body h4 { margin: 0 0 6px; font-size: 17px; line-height: 1.3; }
.news-meta { display: flex; gap: 14px; color: var(--muted); font-size: 13px; margin-top: 10px; }
.dots { display: flex; gap: 6px; justify-content: center; padding: 10px; }
.dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; background: var(--panel3); padding: 0; }
.dots button.on { background: var(--text); width: 22px; border-radius: 4px; }
.news-list .item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.news-list .item:last-child { border-bottom: 0; }

/* ---------- pitch & lineup */
.lineup-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .lineup-wrap { grid-template-columns: minmax(0, 1fr); } }
.pitch { position: relative; width: 100%; max-width: 640px; aspect-ratio: 68 / 100; margin: 0 auto; border-radius: 14px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--pitch1) 0 10%, var(--pitch2) 10% 20%); box-shadow: inset 0 0 80px rgba(0,0,0,0.35); }
.pitch .lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pslot { position: absolute; transform: translate(-50%, -50%); width: 88px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; user-select: none; touch-action: none; }
.pslot .card { width: 58px; border-radius: 9px; background: linear-gradient(180deg, rgba(10,30,36,0.95), rgba(10,26,32,0.95)); border: 1px solid rgba(255,255,255,0.22); padding: 4px 0 3px; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
.pslot.sel .card { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,0.35); }
.pslot.drop .card { border-color: var(--accent-hi); box-shadow: 0 0 0 2px var(--accent-hi); }
.pslot .o { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1; }
.pslot .p { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; }
.pslot .nm { font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8); max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

/* ---------- start & wizard */

.wizard { max-width: 980px; margin: 0 auto; padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.steps { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }

.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }

.any-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); text-align: left; color: inherit; min-width: 0; }

/* ---------- match */
.match-screen { min-height: 100vh; display: flex; flex-direction: column; }
.score-head { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(180deg, rgba(0,0,0,0.35), transparent); }

.lv-grid { display: grid; gap: 14px; align-items: start; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); grid-template-areas: "a b" "d c"; }

.lv-pitch { max-height: 46vh; margin-inline: auto; }

/* ---------- celebration */
.celebrate { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(255,197,77,0.25), rgba(2,8,10,0.92) 60%); overflow: hidden; }

@keyframes float { 50% { transform: translateY(-10px); } }

@media (max-width: 860px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

.simov { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(2, 8, 10, 0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 16px; }

/* ---------- bracket */

/* ---------- misc */

.msg-item { display: flex; gap: 10px; padding: 11px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; text-align: left; width: 100%; background: none; color: var(--text); }
.msg-item:hover { background: var(--panel2); }
.msg-item.on { border-color: var(--line2); background: var(--panel2); }
.msg-item.unread .s { font-weight: 700; }
.msg-item .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--panel3); display: grid; place-items: center; flex: none; }
.trophy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

/* ---------- 2d game */
.g2d { --bs: 1; --ctl: calc(196px * var(--bs)); position: fixed; inset: 0; z-index: 100; background: #1c2228; display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none; }

.g2d-hud { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; gap: 10px; }

.g2d .g2-radar { position: absolute; top: calc(60px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); border-radius: 6px; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
.g2d.so .g2-radar { display: none; }
.g2-say { position: absolute; top: calc(60px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); max-width: min(460px, calc(100% - 150px)); background: rgba(6,14,18,0.78); border-left: 3px solid #f2c230; color: #fff; padding: 6px 10px; border-radius: 0 8px 8px 0; font-size: 14px; font-weight: 600; line-height: 1.3; pointer-events: none; opacity: 0; transition: opacity 0.4s; }

@keyframes g2say { 0% { opacity: 0; transform: translateX(-8px); } 6% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
